services:
  app-frontend:
    image: node:22
    command: sh -c "npm install && npm run dev --workspace=@lh/app -- --host 0.0.0.0 --port 5173"
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "8080:5173"

    environment:
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
    